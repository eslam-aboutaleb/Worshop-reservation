server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version. The default
    # `Server: nginx/1.27.5` hands a scanner the exact patch level to
    # look up against known CVEs; this reduces the header to
    # `Server: nginx`. `proxy_hide_header Server` below handles the
    # upstream's copy, but nginx also stamps its own.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers applied to every response served by nginx.
    # - Content-Security-Policy restricts the origins of script,
    #   style, image, and connection targets so a stored XSS bug
    #   cannot exfiltrate the session cookie or load arbitrary
    #   code. The session cookie is httpOnly + SameSite=Lax so an
    #   attacker who somehow runs script still cannot read it;
    #   CSP is defense-in-depth.
    # - X-Frame-Options: DENY defeats clickjacking; the app has
    #   no legitimate reason to be framed.
    # - Referrer-Policy: same-origin stops the workshop id in the
    #   URL from leaking to outbound links.
    # - X-Content-Type-Options: nosniff blocks MIME sniffing on
    #   the static assets.
    # - Permissions-Policy: opt out of powerful APIs the app
    #   does not use.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Keep the API endpoint on the same origin; nginx otherwise redirects this
    # exact path to a trailing slash and drops the frontend port.
    location = /api/workshops {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    location /api/workshops/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
