[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ws-core"
version = "0.1.0"
description = "Domain-agnostic backend toolkit: config, db, auth, errors, realtime, rate limiting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=21.2.0",
    "fastapi>=0.111.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyjwt[crypto]>=2.8.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=24.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ws_core"]
