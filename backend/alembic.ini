# A generic, single-database Alembic configuration tuned for the
# workshop-reservations service. Connection URL is taken from the
# application settings at migration time, not from here, so we leave
# the placeholder untouched and override programmatically in env.py.

[alembic]
# The migration scripts ship inside the ws-reservation
# plugin; env.py and this file stay in the app.
script_location = migrations
version_locations = libs/reservation/ws_reservation/migrations/versions
path_separator = os
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost/placeholder
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
