[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
ws-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "workshop-reservations-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "structlog>=24.0.0",
    "ws-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "ASYNC"]
# FastAPI's dependency-injection idiom uses function calls in default
# argument positions (e.g. `Depends(get_db)`). B008 is a false positive
# for this pattern; the official FastAPI docs recommend exactly this
# form, and refactoring it would hurt readability without removing a
# real bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Allow bare asserts and long lines inside test files; they're
# intentionally procedural and explanatory.
"tests/**" = ["E501"]
# Alembic migration files are autogenerated; their column lists are
# naturally long and breaking them up hurts diff readability.
"migrations/**" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/seed.py"]
